<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Yumio · 本地产品验收</title><style>*{box-sizing:border-box}body{margin:0;background:#e3e6dc;color:#20251c;font:14px system-ui}header{padding:10px 16px;display:flex;align-items:center;gap:8px;background:#fff;flex-wrap:wrap}button,select{font:inherit;min-height:34px;padding:6px 10px;border:1px solid #bfc8aa;background:#f1f4e8;border-radius:4px}main{padding:14px}#frame{border:0;background:white;display:block;margin:auto;box-shadow:0 0 0 1px #c9cfbe}#status{padding:5px 16px;margin:0;white-space:pre-wrap;font:12px monospace}#results{margin:10px 16px;max-height:360px;overflow:auto;background:white;padding:12px;font:12px/1.5 monospace}#results:empty{display:none}.pass{color:#255a28}.fail{color:#a11f20}</style><header><b>Yumio · 本地产品验收</b><select id="size"><option>390</option><option>375</option><option>650</option><option>768</option><option>1024</option><option selected>1280</option><option>1440</option></select><select id="route"><option value="studio">工坊</option><option value="home">首页</option><option value="market">集市</option><option value="profile">档案</option><option value="about">方案</option></select><button id="apply">切换预览</button><button id="run">运行响应式验收</button><button id="fit">完整页高度</button></header><p id="status"></p><main><iframe id="frame" title="实际浏览器预览" src="qa-product-app.html#studio"></iframe></main><pre id="results"></pre><script>
const frame=document.querySelector('#frame'),size=document.querySelector('#size'),route=document.querySelector('#route'),status=document.querySelector('#status'),results=document.querySelector('#results');let testing=false;
const pause=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const rect=e=>{const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height}};
function metrics(){const w=frame.contentWindow,d=w.document,a=d.querySelector('.benchShelf'),b=d.querySelector('.benchMain');return {width:w.innerWidth,pageWidth:d.documentElement.scrollWidth,route:w.location.hash,left:rect(a),right:rect(b),errors:w.__productErrors||[]}}
function report(){if(testing)return;try{const m=metrics();status.textContent=`实际内容宽 ${m.width}px / 页面宽 ${m.pageWidth}px · ${m.route} · 两栏顶部差 ${Math.abs(m.left.top-m.right.top).toFixed(1)}px / 底部差 ${Math.abs(m.left.bottom-m.right.bottom).toFixed(1)}px · 脚本错误 ${m.errors.length}`}catch{}}
async function apply(){frame.style.width=size.value+'px';frame.style.height=(Number(size.value)>650?'960':'844')+'px';frame.contentWindow.location.hash=route.value;await pause();report()}
frame.onload=apply;document.querySelector('#apply').onclick=apply;document.querySelector('#fit').onclick=()=>{frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px';report()};setInterval(report,1000);
document.querySelector('#run').onclick=async()=>{testing=true;delete results.dataset.fails;delete results.dataset.passes;document.querySelectorAll('header button,header select').forEach(b=>b.disabled=true);results.textContent='';let passes=0,fails=0;const lines=[];function check(name,ok,data){ok?passes++:fails++;lines.push((ok?'PASS ':'FAIL ')+name+' '+JSON.stringify(data??''));results.textContent=lines.join('\n');status.textContent=`运行中：${passes} 通过 / ${fails} 失败`}
try{for(const width of [360,375,390,650,768,900,1024,1280,1440]){frame.style.width=width+'px';frame.style.height='900px';for(const page of ['home','studio','market','profile','about']){frame.contentWindow.location.hash=page;await pause();await pause();const w=frame.contentWindow,d=w.document,m=metrics();check(`${width} / ${page} 无横向溢出`,m.width===width&&m.pageWidth<=m.width,{viewport:m.width,scrollWidth:m.pageWidth});if(page==='studio'){if(m.width>900){check(`${width} 工坊双栏齐边`,Math.abs(m.left.top-m.right.top)<1&&Math.abs(m.left.bottom-m.right.bottom)<1,{left:m.left,right:m.right});const rail=d.querySelector('.toolScroll');check(`${width} 工具可滚动`,rail.scrollHeight>rail.clientHeight,{scrollHeight:rail.scrollHeight,clientHeight:rail.clientHeight})}else check(`${width} 先看作品再用工具`,m.right.top<m.left.top,{canvasTop:m.right.top,toolsTop:m.left.top});const main=rect(d.querySelector('.benchMain')),card=rect(Array.from(d.querySelectorAll('.viewCard')).find(e=>getComputedStyle(e).display!=='none'));check(`${width} 画布控件未溢出作品面板`,card.height>0&&card.bottom<=main.bottom+1,{cardBottom:card.bottom,mainBottom:main.bottom});if(m.width<=650){d.querySelector('#viewTab2d').click();await pause();check(`${width} 2D 标签显示可编辑画布`,getComputedStyle(d.querySelector('#topView')).display!=='none'&&getComputedStyle(d.querySelector('#perspectiveView')).display==='none',{editor:rect(d.querySelector('#editor'))});d.querySelector('#viewTab3d').click()}const header=rect(d.querySelector('.bar')),content=rect(d.querySelector('main')),footer=rect(d.querySelector('footer'));check(`${width} 页头正文页脚共用边线`,Math.abs(header.left-content.left)<1&&Math.abs(content.left-footer.left)<1,{header:header.left,main:content.left,footer:footer.left})}}}
check('浏览器脚本错误',!(frame.contentWindow.__productErrors||[]).length,frame.contentWindow.__productErrors||[]);
}catch(e){check('验收脚本异常',false,String(e))}testing=false;document.querySelectorAll('header button,header select').forEach(b=>b.disabled=false);size.value='1280';route.value='studio';await apply();status.textContent=`完成：${passes} 通过 / ${fails} 失败`;results.dataset.passes=passes;results.dataset.fails=fails;window.qaComplete=true};
</script></html>
